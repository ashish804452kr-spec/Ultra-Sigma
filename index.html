<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Sigma - Professional</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #game-lobby { width: 100vw; height: 100vh; background: url('MAP_IMAGE_LINK_HERE') center/cover; position: relative; color: white; }
        
        /* बटन की स्टाइलिंग */
        .game-btn { position: absolute; border: 2px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; background: rgba(0,0,0,0.5); font-weight: bold; font-size: 14px; }
        
        #fire { bottom: 50px; right: 50px; width: 100px; height: 100px; background: red; }
        #wall { bottom: 150px; right: 50px; width: 70px; height: 70px; background: blue; }
        #medkit { bottom: 50px; right: 160px; width: 70px; height: 70px; background: green; }
        #start { bottom: 20px; left: 20px; width: 120px; height: 50px; background: orange; border-radius: 10px; }
        
        #status-bar { top: 10px; left: 10px; font-size: 20px; color: yellow; }
    </style>
</head>
<body>

<div id="game-lobby">
    <div id="status-bar">HP: 200 | लेवल: 1 | रैंक: ब्रॉन्ज</div>
    
    <div id="fire" class="game-btn" onclick="fire()">फायर</div>
    <div id="wall" class="game-btn" onclick="wall()">वॉल</div>
    <div id="medkit" class="game-btn" onclick="medkit()">मेडकिट</div>
    <div id="start" class="game-btn" onclick="start()">स्टार्ट</div>
</div>

<script>
    function fire() { alert("धड़ाधड़! फायर शुरू!"); }
    function wall() { alert("ग्लो वॉल लग गई!"); }
    function medkit() { alert("हेल्थ बढ़ रही है..."); }
    function start() { alert("मैच शुरू हो रहा है... बिहार मैप लोड हो रहा है!"); }
</script>
</body>
</html>
