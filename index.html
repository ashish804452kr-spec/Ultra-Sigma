<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultra Sigma - Full Game Engine</title>
    <style>
        /* 1. स्क्रीन को हमेशा रोटेट (Landscape) रखने के लिए */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        
        #game-view {
            width: 100vw; height: 100vh;
            background-image: url('APNE_BIHAR_MAP_KA_LINK_YAHAN_DALEN');
            background-size: cover; background-position: center;
            position: relative;
        }

        /* 2. कैरेक्टर को दिखाने का एरिया */
        #player-char {
            position: absolute; bottom: 50px; left: 100px;
            width: 150px; height: 250px;
            background-image: url('APNE_CHARACTER_KA_LINK_YAHAN_DALEN');
            background-size: contain; background-repeat: no-repeat;
        }

        /* 3. फ्री फायर जैसे सभी बटन्स */
        .game-btn { position: absolute; border-radius: 50%; border: 3px solid white; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; cursor: pointer; }
        
        #fire-btn { bottom: 50px; right: 50px; width: 120px; height: 120px; background: rgba(255, 0, 0, 0.7); }
        #wall-btn { bottom: 180px; right: 180px; width: 80px; height: 80px; background: rgba(0, 0, 255, 0.7); }
        #med-btn { bottom: 50px; right: 180px; width: 80px; height: 80px; background: rgba(0, 255, 0, 0.7); }
        
        /* 4. रैंक और लेवल का HUD */
        #hud { position: absolute; top: 20px; left: 20px; color: yellow; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>

    <div id="game-view">
        <div id="hud">रैंक: ब्रॉन्ज | लेवल: 1 | HP: 200</div>
        
        <div id="player-char"></div>
        
        <div id="fire-btn" class="game-btn" onclick="action('FIRE')">FIRE</div>
        <div id="wall-btn" class="game-btn" onclick="action('WALL')">WALL</div>
        <div id="med-btn" class="game-btn" onclick="action('MED')">MED</div>
    </div>

    <script>
        function action(type) {
            if(type === 'FIRE') alert("गोली चल रही है!");
            else if(type === 'WALL') alert("ग्लो वॉल लग गई!");
            else if(type === 'MED') alert("हेल्थ फुल हो गई!");
        }
    </script>
</body>
</html>
