<!DOCTYPE html>
<html>
<head>
  <title>Ultra Sigma</title>

  <style>
    body{
      margin:0;
      background:black;
      color:white;
      font-family:Arial;
    }

    .header{
      background:linear-gradient(90deg,#111,#ff9900);
      padding:20px;
      text-align:center;
      font-size:30px;
      font-weight:bold;
    }

    .lobby{
      height:300px;
      background:url('https://images.unsplash.com/photo-1511512578047-dfb367046420');
      background-size:cover;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
    }

    .character{
      width:180px;
      border-radius:20px;
      box-shadow:0 0 20px cyan;
    }

    .buttons{
      margin-top:20px;
    }

    button{
      padding:15px 25px;
      margin:10px;
      border:none;
      border-radius:10px;
      background:#ff9900;
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    .profile{
      padding:20px;
      background:#111;
    }

    .guns{
      display:flex;
      gap:20px;
      padding:20px;
      overflow:auto;
    }

    .gun{
      background:#222;
      padding:10px;
      border-radius:10px;
    }

    .footer{
      text-align:center;
      padding:20px;
      background:#000;
    }
  </style>
</head>

<body>

<div class="header">
  ULTRA SIGMA
</div>

<div class="lobby">

  <img class="character"
  src="https://i.imgur.com/2DhmtJ4.png">

  <h1>WELCOME PLAYER</h1>

  <div class="buttons">
    <button onclick="startGame()">
      START GAME
    </button>

    <button onclick="openProfile()">
      PROFILE
    </button>
  </div>

</div>

<div class="profile">

  <h2>PLAYER PROFILE</h2>

  <p>NAME : ASHISH</p>
  <p>LEVEL : 70</p>
  <p>RANK : HEROIC</p>
  <p>LIKES : 99999</p>

</div>

<div class="guns">

  <div class="gun">
    <img width="150"
    src="https://i.imgur.com/qIufhof.png">
    <p>AK47 DRAGON</p>
  </div>

  <div class="gun">
    <img width="150"
    src="https://i.imgur.com/qIufhof.png">
    <p>MP40 COBRA</p>
  </div>

  <div class="gun">
    <img width="150"
    src="https://i.imgur.com/qIufhof.png">
    <p>M1887</p>
  </div>

</div>

<div class="footer">
  © ULTRA SIGMA GAME
</div>

<script>

function startGame(){
  alert("MATCH STARTING...");
}

function openProfile(){
  alert("OPENING PROFILE...");
}

</script>

</body>
</html>
